spring.application.name=backend

# ── DataSource (SQL Server) ──────────────────────────────────────────────────
#
# All database credentials are read from environment variables so that no real
# password is ever committed to source control.
#
# Required env vars:
#   DB_URL       — JDBC connection string, e.g.:
#                  jdbc:sqlserver://localhost:1433;databaseName=BookCrudDev;
#                  encrypt=true;trustServerCertificate=true
#   DB_USERNAME  — SQL Server login name, e.g. sa
#   DB_PASSWORD  — SQL Server password (must meet SQL Server complexity rules)
#
# The :default syntax after ${VAR means "use this if the env var is not set".
# DB_URL and DB_USERNAME have safe defaults for local development.
# DB_PASSWORD has no default — the app will refuse to start if it is unset,
# which prevents accidental connections with an empty password.
#
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BookCrudDev;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
#
# ddl-auto=validate: when the app starts, Hibernate reads the existing schema
# from SQL Server and checks that it matches the @Entity mappings. If a column
# is missing or mistyped, the app fails immediately with a clear error.
# Flyway is responsible for creating/altering the schema — Hibernate never
# creates, alters, or drops tables.
#
# open-in-view=false: disables the OSIV anti-pattern. With OSIV enabled,
# Hibernate keeps a database connection open for the entire HTTP request/
# response cycle, which causes subtle lazy-loading bugs and wastes connections.
# Always disable it in production-minded code.
#
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# SQL logging: disabled by default. To see generated SQL, run with profile "dev"
# or set logging.level.org.hibernate.SQL=DEBUG temporarily during development.
spring.jpa.show-sql=false

# ── Flyway ───────────────────────────────────────────────────────────────────
#
# Flyway runs automatically at startup (spring.flyway.enabled=true is the
# default). It looks for versioned SQL files on the classpath under db/migration,
# checks which ones it has already applied (stored in flyway_schema_history),
# and runs any new ones in version order.
#
# The migration SQL files are copied from database/migrations/ into the JAR's
# classpath at build time by the Maven resource plugin in pom.xml.
#
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
