# Test-only overrides.
#
# The context-loads test (BackendApplicationTests) runs without a real SQL Server.
# These properties disable DataSource, JPA, and Flyway auto-configuration so that
# the Spring application context can be assembled and verified without a database
# connection. Integration tests that need a real database will use Testcontainers
# and will override these settings at the test class level.
#
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
